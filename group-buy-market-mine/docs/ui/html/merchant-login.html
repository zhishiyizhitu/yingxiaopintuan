<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家登录 - 拼团团商家后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-form {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .switch-form {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .switch-form a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-form a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #c33;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #3c3;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        /* 注册表单样式 */
        .register-form {
            display: none;
        }

        .register-form.active {
            display: block;
        }

        .login-form-content {
            display: block;
        }

        .login-form-content.hide {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🏪</div>
            <h1>拼团团商家后台</h1>
            <p>欢迎回来，请登录您的账号</p>
        </div>

        <!-- 登录表单 -->
        <div class="login-form">
            <div class="login-form-content" id="loginFormContent">
                <div class="error-message" id="loginError"></div>
                <div class="success-message" id="loginSuccess"></div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        登录
                    </button>
                </form>

                <div class="switch-form">
                    还没有账号？<a onclick="showRegister()">立即注册</a>
                </div>
            </div>

            <!-- 注册表单 -->
            <div class="register-form" id="registerFormContent">
                <div class="error-message" id="registerError"></div>
                <div class="success-message" id="registerSuccess"></div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regUsername">用户名</label>
                        <input type="text" id="regUsername" name="regUsername" required placeholder="请输入用户名" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="regPassword">密码</label>
                        <input type="password" id="regPassword" name="regPassword" required placeholder="请输入密码" autocomplete="new-password">
                    </div>

                    <div class="form-group">
                        <label for="regNickname">昵称</label>
                        <input type="text" id="regNickname" name="regNickname" placeholder="请输入昵称（可选）">
                    </div>

                    <div class="form-group">
                        <label for="regPhone">手机号</label>
                        <input type="tel" id="regPhone" name="regPhone" placeholder="请输入手机号（可选）">
                    </div>

                    <button type="submit" class="login-btn" id="registerBtn">
                        注册
                    </button>
                </form>

                <div class="switch-form">
                    已有账号？<a onclick="showLogin()">返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/group-buy-market-mine/api/v1/gbm/admin';

        // 显示注册表单
        function showRegister() {
            document.getElementById('loginFormContent').classList.add('hide');
            document.getElementById('registerFormContent').classList.add('active');
            clearMessages();
        }

        // 显示登录表单
        function showLogin() {
            document.getElementById('registerFormContent').classList.remove('active');
            document.getElementById('loginFormContent').classList.remove('hide');
            clearMessages();
        }

        // 清除消息
        function clearMessages() {
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginSuccess').style.display = 'none';
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('registerSuccess').style.display = 'none';
        }

        // 显示错误消息
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // 显示成功消息
        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }

        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const result = await response.json();

                if (result.code === '0000' && result.data) {
                    // 保存用户信息到 localStorage
                    localStorage.setItem('merchantUser', JSON.stringify(result.data));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    showSuccess('loginSuccess', '登录成功，正在跳转...');
                    
                    // 延迟跳转到商家后台首页
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1000);
                } else {
                    showError('loginError', result.info || '登录失败，请检查用户名和密码');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            } catch (error) {
                console.error('登录错误:', error);
                showError('loginError', '网络错误，请稍后重试');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        }

        // 处理注册
        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const nickname = document.getElementById('regNickname').value;
            const phone = document.getElementById('regPhone').value;
            const registerBtn = document.getElementById('registerBtn');

            registerBtn.disabled = true;
            registerBtn.textContent = '注册中...';

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        nickname: nickname || username,
                        phone: phone
                    })
                });

                const result = await response.json();

                if (result.code === '0000') {
                    showSuccess('registerSuccess', '注册成功，正在跳转到登录...');
                    
                    setTimeout(() => {
                        showLogin();
                        document.getElementById('username').value = username;
                        document.getElementById('password').value = '';
                    }, 1500);
                } else {
                    showError('registerError', result.info || '注册失败');
                    registerBtn.disabled = false;
                    registerBtn.textContent = '注册';
                }
            } catch (error) {
                console.error('注册错误:', error);
                showError('registerError', '网络错误，请稍后重试');
                registerBtn.disabled = false;
                registerBtn.textContent = '注册';
            }
        }

        // 检查是否已登录
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const user = localStorage.getItem('merchantUser');
            
            if (isLoggedIn === 'true' && user) {
                // 已登录，直接跳转到后台首页
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
