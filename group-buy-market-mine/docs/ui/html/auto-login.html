<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动登录并跳转</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }
        .loading {
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            color: #667eea;
            margin: 0;
        }
        p {
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <h2>正在登录...</h2>
        <p>请稍候，正在设置登录状态并跳转到商城</p>
    </div>

    <script>
        // 自动设置登录状态
        const username = 'xiaofuge';
        
        // 保存到 localStorage
        localStorage.setItem('loginToken', username);
        localStorage.setItem('username', username);
        localStorage.setItem('rememberedUsername', username);
        
        // 设置 Cookie
        document.cookie = `loginToken=${username}; path=/; max-age=${7 * 24 * 60 * 60}`;
        document.cookie = `username=${username}; path=/; max-age=${7 * 24 * 60 * 60}`;
        
        console.log('✅ 登录状态已设置');
        console.log('localStorage.loginToken:', localStorage.getItem('loginToken'));
        console.log('Cookie:', document.cookie);
        
        // 延迟跳转
        setTimeout(function() {
            console.log('跳转到商城页面');
            window.location.href = 'index.html';
        }, 1500);
    </script>
</body>
</html>
