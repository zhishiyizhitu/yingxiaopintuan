﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 拼团团拼团商城</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon">🛒</span>
                    <h1>拼团团拼团</h1>
                </div>
                <p class="subtitle">多人拼团 · 优惠共享</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <span class="icon">👤</span>
                        用户名
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="请输入用户名"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        <span class="icon">🔒</span>
                        密码
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="请输入密码"
                        required
                    >
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-password" onclick="showRegister(); return false;">注册账号</a>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">立即登录</span>
                    <span class="btn-icon">→</span>
                </button>

                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
            </form>

            <!-- 注册表单（默认隐藏） -->
            <form id="registerForm" class="login-form" style="display: none;">
                <h2 style="text-align: center; color: #667eea; margin-bottom: 25px;">注册新账号</h2>
                
                <div class="form-group">
                    <label for="regUsername">
                        <span class="icon">👤</span>
                        用户名
                    </label>
                    <input 
                        type="text" 
                        id="regUsername" 
                        name="regUsername" 
                        placeholder="请输入用户名（3-16 位字母数字）"
                        autocomplete="off"
                        required
                        minlength="3"
                        maxlength="16"
                    >
                </div>

                <div class="form-group">
                    <label for="regPassword">
                        <span class="icon">🔒</span>
                        密码
                    </label>
                    <input 
                        type="password" 
                        id="regPassword" 
                        name="regPassword" 
                        placeholder="请输入密码（6 位以上）"
                        required
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword">
                        <span class="icon">🔒</span>
                        确认密码
                    </label>
                    <input 
                        type="password" 
                        id="regConfirmPassword" 
                        name="regConfirmPassword" 
                        placeholder="请再次输入密码"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="regNickname">
                        <span class="icon">👤</span>
                        昵称（可选）
                    </label>
                    <input 
                        type="text" 
                        id="regNickname" 
                        name="regNickname" 
                        placeholder="请输入昵称"
                    >
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">立即注册</span>
                    <span class="btn-icon">→</span>
                </button>

                <div style="text-align: center; margin-top: 15px;">
                    <a href="#" onclick="showLogin(); return false;" style="color: #667eea; font-size: 14px;">返回登录</a>
                </div>

                <div class="error-message" id="regErrorMessage"></div>
                <div class="success-message" id="regSuccessMessage"></div>
            </form>

            <div class="login-footer">
                <p>© 2025 拼团团拼团商城 - DDD 架构实践</p>
            </div>
        </div>

        <div class="background-decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
