﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付回调测试 - 拼团团拼团商城</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .callback-container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .callback-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .callback-title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }

        .callback-message {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .callback-info {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row .label {
            color: #888;
            font-weight: 500;
        }

        .info-row .value {
            color: #333;
            font-weight: 600;
            font-family: monospace;
        }

        .info-row .value.success {
            color: #2ed573;
        }

        .callback-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading-state {
            padding: 40px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #d4edda;
            color: #155724;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .callback-container {
                padding: 40px 25px;
            }

            .callback-icon {
                font-size: 60px;
            }

            .callback-title {
                font-size: 24px;
            }

            .callback-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <!-- 加载状态 -->
        <div id="loadingState" class="loading-state">
            <div class="loading-spinner"></div>
            <p>正在处理支付结果...</p>
        </div>

        <!-- 成功状态 -->
        <div id="successState" style="display: none;">
            <div class="callback-icon">✅</div>
            <div class="success-badge">支付成功</div>
            <h1 class="callback-title">恭喜您，拼团成功！</h1>
            <p class="callback-message">
                您的支付已完成，我们将尽快为您处理订单。<br>
                拼团成功后，商品将发往您的收货地址。
            </p>

            <div class="callback-info" id="callbackInfo">
                <!-- 动态填充订单信息 -->
            </div>

            <div class="callback-actions">
                <a href="order-list.html" class="btn btn-primary">查看订单</a>
                <a href="index.html" class="btn btn-secondary">继续购物</a>
            </div>
        </div>

        <!-- 失败状态 -->
        <div id="errorState" style="display: none;">
            <div class="callback-icon">❌</div>
            <h1 class="callback-title">支付失败</h1>
            <p class="callback-message">
                很抱歉，您的支付未能成功完成。<br>
                请检查您的支付账户或联系客服。
            </p>

            <div class="error-message" id="errorMessage">
                <!-- 错误信息 -->
            </div>

            <div class="callback-actions">
                <a href="order-list.html" class="btn btn-primary">查看订单</a>
                <a href="index.html" class="btn btn-secondary">返回商品页</a>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/test-callback.js"></script>
</body>
</html>
